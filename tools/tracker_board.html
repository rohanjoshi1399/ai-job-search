<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Board</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #e9ebef; --card: #ffffff; --ink: #1d2330; --muted: #5d6677;
  --line: #d5d9e0; --accent: #2f5bd3; --warn: #a15c00; --warn-bg: #fff1dc; --hot: #b42318; --hot-bg: #fde8e6;
  --ok: #1d7a46; --ok-bg: #e3f4ea; --chip: #eef1f6; --drop: #dbe5ff; --shadow: 0 1px 2px rgba(20, 28, 45, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1b1f27; --card: #232834; --ink: #e7eaf0; --muted: #9aa3b4;
    --line: #333a48; --accent: #7aa2ff; --warn: #f0b45c; --warn-bg: #3a2c14; --hot: #ff8a7a; --hot-bg: #3d1f1c;
    --ok: #6fd39b; --ok-bg: #173325; --chip: #2b3140; --drop: #263559; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --panel: #1b1f27; --card: #232834; --ink: #e7eaf0; --muted: #9aa3b4;
  --line: #333a48; --accent: #7aa2ff; --warn: #f0b45c; --warn-bg: #3a2c14; --hot: #ff8a7a; --hot-bg: #3d1f1c;
  --ok: #6fd39b; --ok-bg: #173325; --chip: #2b3140; --drop: #263559; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 16px 20px 8px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
input[type="search"], select, input[type="date"], button {
  font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.hint { padding: 0 20px 10px; color: var(--muted); font-size: 12.5px; }
.board { display: flex; gap: 12px; padding: 4px 20px 24px; overflow-x: auto; align-items: flex-start; }
.col { flex: 0 0 268px; background: var(--panel); border-radius: 10px; padding: 10px; min-height: 120px;
  max-height: calc(100vh - 130px); display: flex; flex-direction: column; }
.col.over { outline: 2px dashed var(--accent); background: var(--drop); }
.col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 2px 4px 2px; display: flex; justify-content: space-between; }
.col h2 span { color: var(--muted); font-variant-numeric: tabular-nums; }
.col .sub { color: var(--muted); font-size: 12px; margin: 0 4px 8px; }
.cards { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; box-shadow: var(--shadow); cursor: grab; }
.card.ro { cursor: default; }
.card.dragging { opacity: .45; }
.co { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.fit { font-size: 11.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.role { color: var(--muted); margin: 2px 0 6px; font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.tag.hot { background: var(--hot-bg); color: var(--hot); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.links { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; }
.links a { color: var(--accent); text-decoration: none; }
.links a:hover { text-decoration: underline; }
details.notes { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
details.notes summary { cursor: pointer; }
details.notes p { margin: 4px 0 0; white-space: pre-wrap; }
.row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; gap: 6px; }
.row2 select { font-size: 12px; padding: 2px 4px; }
.empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 14px 4px; border: 1px dashed var(--line); border-radius: 8px; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); padding: 18px; width: min(360px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10, 14, 22, .45); }
dialog h3 { margin: 0 0 4px; font-size: 16px; }
dialog p { margin: 0 0 12px; color: var(--muted); }
dialog label { display: block; margin: 10px 0 4px; font-size: 13px; }
dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
@media (max-width: 640px) {
  header, .hint { padding-left: 16px; padding-right: 16px; }
  .board { padding-left: 16px; padding-right: 16px; }
  .tools { margin-left: 0; width: 100%; }
  .tools input { flex: 1; }
}
</style>
</head>
<body>
<header>
  <h1>Application Board</h1>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Filter by company or role" aria-label="Filter">
    <button id="reload" title="Re-read the tracker from disk">Reload</button>
  </div>
</header>
<div class="hint">Drag a card to another list, or use its "Move to" menu. Each move is saved to job_search_tracker.csv straight away. Use /outcome for interview details and feedback.</div>
<main class="board" id="board"></main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div id="dlgStatusWrap"><label for="dlgStatus">Outcome</label><select id="dlgStatus"></select></div>
    <div id="dlgDateWrap"><label for="dlgDate">Date</label><input type="date" id="dlgDate"></div>
    <div class="acts"><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">Save move</button></div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const TOKEN = "__BOARD_TOKEN__";
const COLUMNS = [
  { id: "shortlist", title: "Ranked, not started", sub: "From /rank. Start one with /apply.", readOnly: true },
  { id: "todo", title: "To submit", sub: "Documents ready, not sent", statuses: ["drafted"] },
  { id: "hold", title: "On hold", sub: "Paused on purpose", statuses: ["on_hold"] },
  { id: "applied", title: "Applied", sub: "Submitted, waiting", statuses: ["applied"] },
  { id: "interview", title: "Interviewing", statuses: ["interview"] },
  { id: "offer", title: "Offer", statuses: ["offer", "hired"] },
  { id: "closed", title: "Closed", statuses: ["rejected", "no_response", "withdrawn", "offer_declined"] },
];
const LABEL = { drafted: "To submit", on_hold: "On hold", applied: "Applied", interview: "Interviewing", offer: "Offer received",
  hired: "Hired", rejected: "Rejected", no_response: "No response", withdrawn: "Withdrawn", offer_declined: "Offer declined" };
const FILES = [[/^form_pack\.md$/, "Form pack"], [/_Resume_.*\.pdf$/, "Resume"], [/_Cover_Letter_.*\.pdf$/, "Letter"],
  [/^referral_dms\.md$/, "Referral DMs"], [/^job_posting\.md$/, "Saved posting"]];
let data = null, dragIdx = null;

const $ = (sel) => document.querySelector(sel);
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }
function days(from, to) { return Math.round((Date.parse(to) - Date.parse(from)) / 86400000); }
function safeUrl(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } }
function colOf(status) { return COLUMNS.find(c => c.statuses && c.statuses.includes(status)) || COLUMNS[1]; }
function lastTouch(r) {
  const ds = [r.date, ...(r.notes.match(/\d{4}-\d{2}-\d{2}/g) || [])].filter(d => d && d <= data.today).sort();
  return ds[ds.length - 1] || r.date;
}

async function load() {
  const res = await fetch("/api/board", { cache: "no-store" });
  data = await res.json();
  if (data.error) { toast("Could not read tracker: " + data.error); return; }
  render();
}

function deadlineTag(dl) {
  if (!dl || !/^\d{4}-\d{2}-\d{2}$/.test(dl)) return null;
  const d = days(data.today, dl);
  if (d < 0) return el("span", "tag hot", "Deadline passed");
  if (d <= 7) return el("span", "tag hot", d === 0 ? "Closes today" : `Closes in ${d}d`);
  return el("span", "tag", "Closes " + dl);
}

function rowCard(r) {
  const c = el("article", "card"); c.draggable = true; c.dataset.idx = r.idx;
  const co = el("div", "co"); co.append(el("span", null, r.company));
  if (r.fit_rating) co.append(el("span", "fit", "fit " + r.fit_rating));
  c.append(co, el("div", "role", r.role));
  const meta = el("div", "meta");
  if (["drafted", "on_hold"].includes(r.status)) meta.append(el("span", "tag", "Drafted " + r.date));
  else meta.append(el("span", "tag", (r.status === "applied" ? "Applied " : "Since ") + r.date));
  if (["drafted", "on_hold"].includes(r.status)) { const t = deadlineTag(r.deadline); if (t) meta.append(t); }
  if (["applied", "interview"].includes(r.status)) {
    const q = days(lastTouch(r), data.today);
    meta.append(el("span", q >= 10 && r.status === "applied" ? "tag warn" : "tag", q >= 10 && r.status === "applied" ? `${q}d quiet, follow up?` : `${q}d since update`));
  }
  if (colOf(r.status).statuses.length > 1) meta.append(el("span", r.status === "hired" ? "tag ok" : "tag", LABEL[r.status] || r.status));
  c.append(meta);
  const links = el("div", "links");
  const live = safeUrl(r.source);
  if (live) { const a = el("a", null, "Posting"); a.href = live; a.target = "_blank"; a.rel = "noopener noreferrer"; links.append(a); }
  const fileLink = (f, label) => {
    const a = el("a", null, label);
    a.href = `/${f.endsWith(".md") ? "view" : "files"}/${r.stem}/${encodeURIComponent(f)}`; a.target = "_blank"; links.append(a);
  };
  for (const [prefix, label] of FILES) {
    const f = r.files.find(n => prefix.test(n));
    if (f && r.stem) fileLink(f, label);
  }
  if (r.research) { const a = el("a", null, "Research"); a.href = `/research/${encodeURIComponent(r.research)}`; a.target = "_blank"; links.append(a); }
  if (r.stem) for (const f of r.files.filter(n => /^interview_prep_.+\.md$/.test(n)))
    fileLink(f, "Prep: " + f.slice(15, -3).replace(/_/g, " "));
  if (links.childNodes.length) c.append(links);
  if (r.notes) { const d = el("details", "notes"); d.append(el("summary", null, "Notes"), el("p", null, r.notes)); c.append(d); }
  const row2 = el("div", "row2");
  const sel = el("select"); sel.setAttribute("aria-label", "Move " + r.company + " to");
  sel.append(new Option("Move to…", ""));
  for (const col of COLUMNS) if (!col.readOnly) sel.append(new Option(col.title, col.id));
  sel.onchange = () => { if (sel.value) requestMove(r, sel.value, true); sel.value = ""; };
  row2.append(sel); c.append(row2);
  c.addEventListener("dragstart", e => { dragIdx = r.idx; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(r.idx)); });
  c.addEventListener("dragend", () => { c.classList.remove("dragging"); dragIdx = null; });
  return c;
}

function shortCard(j) {
  const c = el("article", "card ro");
  const co = el("div", "co"); co.append(el("span", null, j.company));
  if (j.score != null) co.append(el("span", "fit", "score " + j.score));
  c.append(co, el("div", "role", j.title));
  const meta = el("div", "meta");
  if (j.excluded) { c.style.opacity = ".6"; meta.append(el("span", "tag hot", j.excluded)); }
  if (j.other_role) meta.append(el("span", "tag warn", "You track another role here"));
  if (j.location) meta.append(el("span", "tag", j.location));
  const t = deadlineTag(j.deadline); if (t) meta.append(t);
  c.append(meta);
  const live = safeUrl(j.url);
  if (live) { const links = el("div", "links"); const a = el("a", null, "Posting"); a.href = live; a.target = "_blank"; a.rel = "noopener noreferrer"; links.append(a); c.append(links); }
  return c;
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const hit = (s) => !q || s.toLowerCase().includes(q);
  const rows = data.rows.filter(r => hit(r.company + " " + r.role));
  const count = (sts) => data.rows.filter(r => sts.includes(r.status)).length;
  const stats = $("#stats"); stats.replaceChildren();
  for (const [label, sts] of [["Submitted", ["applied", "interview", "offer", "hired", "rejected", "no_response", "offer_declined"]],
                              ["To submit", ["drafted"]], ["Interviewing", ["interview"]], ["Ranked, not started", null]]) {
    const s = el("span"); s.append(el("b", null, String(sts ? count(sts) : data.shortlist.length)), " " + label); stats.append(s);
  }
  const board = $("#board"); board.replaceChildren();
  for (const col of COLUMNS) {
    const sec = el("section", "col"); sec.dataset.col = col.id;
    const items = col.readOnly ? data.shortlist.filter(j => hit(j.company + " " + j.title))
      : rows.filter(r => col.statuses.includes(r.status)).sort((a, b) =>
          (a.deadline || "9999").localeCompare(b.deadline || "9999") || (Number(b.fit_rating) || 0) - (Number(a.fit_rating) || 0));
    const h = el("h2"); h.append(el("span", null, col.title), el("span", null, String(items.length)));
    sec.append(h); if (col.sub) sec.append(el("div", "sub", col.sub));
    const list = el("div", "cards");
    if (!items.length) list.append(el("div", "empty", col.readOnly ? "Nothing ranked" : "Drop a card here"));
    for (const it of items) list.append(col.readOnly ? shortCard(it) : rowCard(it));
    sec.append(list);
    if (!col.readOnly) {
      sec.addEventListener("dragover", e => { if (dragIdx != null) { e.preventDefault(); sec.classList.add("over"); } });
      sec.addEventListener("dragleave", e => { if (!sec.contains(e.relatedTarget)) sec.classList.remove("over"); });
      sec.addEventListener("drop", e => { e.preventDefault(); sec.classList.remove("over");
        const r = data.rows.find(x => x.idx === dragIdx); if (r) requestMove(r, col.id); });
    }
    board.append(sec);
  }
}

function requestMove(r, colId, fromMenu) {
  const col = COLUMNS.find(c => c.id === colId);
  if (col.statuses.includes(r.status) && (!fromMenu || col.statuses.length === 1)) return;
  const needsStatus = col.statuses.length > 1;
  const submitting = ["drafted", "on_hold"].includes(r.status) && !["drafted", "on_hold"].includes(col.statuses[0]);
  $("#dlgTitle").textContent = `${r.company} → ${col.title}`;
  $("#dlgText").textContent = r.role;
  const ds = $("#dlgStatus"); ds.replaceChildren();
  for (const s of col.statuses) ds.append(new Option(LABEL[s], s));
  $("#dlgStatusWrap").hidden = !needsStatus;
  $("#dlgDate").value = data.today;
  $("#dlgDateWrap").querySelector("label").textContent = submitting ? "Submitted on" : "Date";
  const dlg = $("#dlg");
  dlg.returnValue = "";
  dlg.onclose = () => { if (dlg.returnValue === "ok") save(r, needsStatus ? ds.value : col.statuses[0], $("#dlgDate").value); };
  dlg.showModal();
}

async function save(r, status, when) {
  const res = await fetch("/api/move", { method: "POST",
    headers: { "Content-Type": "application/json", "X-Board-Token": TOKEN },
    body: JSON.stringify({ idx: r.idx, company: r.company, role: r.role, status, date: when || data.today }) });
  const out = await res.json();
  if (!res.ok || out.error) { toast("Not saved: " + (out.error || res.status)); return; }
  data = out; render(); toast(`${r.company}: ${LABEL[status] || status}, saved to the tracker`);
}

$("#q").addEventListener("input", () => data && render());
$("#reload").addEventListener("click", () => load().then(() => toast("Reloaded from disk")));
load();
</script>
</body>
</html>
